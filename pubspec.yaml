name: rooz_store
description: "ROOZ Store - Premium multi-vendor marketplace platform for seamless shopping, efficient logistics, and comprehensive business management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.7.2
  intl: ^0.20.3
  email_otp: ^3.0.0
  mailer: ^6.3.1
  url_launcher: ^6.3.1
  http: ^1.1.0
  cloudinary_public: ^0.23.1
  image_picker: ^1.1.2
  fl_chart: ^0.66.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  emoji_picker_flutter: ^4.5.2
  file_picker: ^8.1.3
  record: ^7.1.1
  audioplayers: ^6.1.0
  geolocator: ^13.0.1
  shared_preferences: ^2.5.1
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/rounded-image.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/rounded-image.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/